#window_title_format kitty
scrollback_lines 10000
enable_audio_bell no
visual_bell_duration 0.0

font_family      JetBrainsMono Nerd Font
bold_font        JetBrainsMono Nerd Font Bold
italic_font      JetBrainsMono Nerd Font Italic
bold_italic_font JetBrainsMono Nerd Font Bold Italic
font_size        10.0

# Emoji/symbol fallback (Noto Color Emoji covers these ranges)
symbol_map U+203C,U+2139,U+2300-U+23FF,U+2600-U+26FF,U+2700-U+27BF,U+1F300-U+1F9FF Noto Color Emoji

adjust_line_height  2
adjust_column_width 0

window_padding_width 8
placement_strategy center
hide_window_decorations yes

background_opacity 0.96

background #2e3440
foreground #d8dee9
cursor     #d8dee9

selection_background #434c5e
selection_foreground #eceff4

url_color #88c0d0

color0  #3b4252
color1  #bf616a
color2  #a3be8c
color3  #ebcb8b
color4  #81a1c1
color5  #b48ead
color6  #88c0d0
color7  #e5e9f0
color8  #4c566a
color9  #bf616a
color10 #a3be8c
color11 #ebcb8b
color12 #81a1c1
color13 #b48ead
color14 #8fbcbb
color15 #eceff4

# =========================
# Key Bindings
# =========================
copy_on_select no
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard


map ctrl+shift+1 change_font_size all +2.0
map ctrl+shift+- change_font_size all -2.0


# Middle-click paste was happening twice; rely on kitty's default binding instead of
# adding another mapping that fires alongside the built-in one.
# mouse_map middle press ungrabbed paste_from_selection

map ctrl+shift+f launch --stdin-source=@screen ~/.config/kitty/kitty-fzf-search.sh
